# =====================================================================
# AI Tech Pulse: full local stack
#
#   docker compose up -d --build
#   open http://localhost:8000
#
# Services
#   ollama       local LLM + embedding server (models persisted in a volume)
#   ollama-init  one-shot job that pulls qwen2.5 + nomic-embed-text
#   backend      FastAPI + LangGraph agent, also serves the PWA
#
# GPU: on a machine with an NVIDIA GPU + NVIDIA Container Toolkit,
# uncomment the `deploy:` blocks to run Ollama (and Whisper) on the GPU.
# =====================================================================
services:
  ollama:
    image: ollama/ollama:latest
    container_name: aitp-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # ports: ["11434:11434"]          # uncomment to reach Ollama from the host
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  backend:
    build: .
    container_name: aitp-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      DATA_DIR: /data
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      # Allowed frontend origins when the PWA is hosted elsewhere (Netlify, Vercel, ...)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5500}
    volumes:
      - app_data:/data                # ChromaDB knowledge base + SQLite progress
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  ollama_models:
  app_data:
