<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#2a323d"/>

  <!-- laptop -->
  <rect x="64" y="104" width="150" height="96" rx="8" fill="#161c24" stroke="#2a323d" stroke-width="2"/>
  <rect x="74" y="114" width="130" height="76" rx="4" fill="#0f141a"/>
  <g fill="url(#accent)">
    <rect x="84" y="126" width="64" height="6" rx="3"/>
    <rect x="84" y="140" width="96" height="6" rx="3" opacity="0.75"/>
    <rect x="84" y="154" width="80" height="6" rx="3" opacity="0.55"/>
  </g>
  <path d="M48 206 h182 l-10 12 h-162 z" fill="#1e2630" stroke="#2a323d" stroke-width="2"/>

  <!-- phone -->
  <rect x="238" y="112" width="58" height="104" rx="10" fill="#161c24" stroke="#2a323d" stroke-width="2"/>
  <rect x="245" y="124" width="44" height="78" rx="4" fill="#0f141a"/>
  <circle cx="267" cy="152" r="9" fill="#22c55e" opacity="0.9"/>
  <rect x="252" y="172" width="30" height="5" rx="2.5" fill="#38bdf8" opacity="0.8"/>
  <rect x="256" y="183" width="22" height="5" rx="2.5" fill="#38bdf8" opacity="0.5"/>

  <!-- on-device AI core (orbit) -->
  <circle cx="356" cy="162" r="34" fill="url(#core)"/>
  <ellipse cx="356" cy="162" rx="46" ry="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <ellipse cx="356" cy="162" rx="16" ry="46" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="402" cy="162" r="5" fill="#38bdf8"/>
  <circle cx="356" cy="116" r="5" fill="#a78bfa"/>

  <text x="440" y="150" font-size="60" font-weight="700" fill="#f3f4f6">Abhify<tspan fill="url(#accent)">.AI</tspan></text>
  <text x="442" y="196" font-size="24" fill="#9ca3af">Private personal AI on your own device: Windows, Android and the browser</text>

  <g font-size="15" font-weight="600">
    <rect x="442" y="226" width="150" height="32" rx="16" fill="#0f2a1c" stroke="#166534"/>
    <text x="517" y="247" text-anchor="middle" fill="#4ade80">Local-first AI</text>
    <rect x="604" y="226" width="236" height="32" rx="16" fill="#0c2233" stroke="#075985"/>
    <text x="722" y="247" text-anchor="middle" fill="#7dd3fc">Ollama · llama.cpp · WebLLM</text>
    <rect x="852" y="226" width="104" height="32" rx="16" fill="#2a1f0b" stroke="#92400e"/>
    <text x="904" y="247" text-anchor="middle" fill="#fbbf24">RAG</text>
    <rect x="968" y="226" width="110" height="32" rx="16" fill="#241433" stroke="#6b21a8"/>
    <text x="1023" y="247" text-anchor="middle" fill="#d8b4fe">Kotlin</text>
    <rect x="1090" y="226" width="120" height="32" rx="16" fill="#1e2630" stroke="#2a323d"/>
    <text x="1150" y="247" text-anchor="middle" fill="#d1d5db">FastAPI</text>
  </g>
</svg>
