      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- robot head -->
  <line x1="256" y1="96" x2="256" y2="136" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="88" r="18" fill="#fff"/>
  <rect x="120" y="136" width="272" height="208" rx="56" fill="#0f172a" fill-opacity=".9"/>
  <circle cx="200" cy="232" r="26" fill="#a5f3fc"/>
  <circle cx="312" cy="232" r="26" fill="#a5f3fc"/>
